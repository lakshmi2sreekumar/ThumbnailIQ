# .streamlit/config.toml
# ThumbnailIQ theme — mirrors the CSS design tokens in styles.py
# Edit values here to propagate changes to both Streamlit's native widgets
# and your custom CSS variables simultaneously.

[theme]
# Base palette
primaryColor   = "#2F5BFF"      # accent-a (blue)  — buttons, links, focus rings
backgroundColor = "#FAFAF8"     # --bg  warm off-white page background
secondaryBackgroundColor = "#FFFFFF"  # --surface  card/widget backgrounds
textColor      = "#16181D"      # --text-primary

# Font — Streamlit uses this for native widgets; Google Fonts CDN covers headings
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
